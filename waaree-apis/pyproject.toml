[project]
name = "waaree-apis"
version = "0.1.0"
description = "Waaree CMS backend API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pyodbc>=5.3.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "tzdata>=2026.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["B008"] # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"migrations/**" = ["E501"]
"**/models.py" = ["RUF012"] # SQLAlchemy's __table_args__ = {...} idiom

[tool.pyright]
include = ["app", "migrations"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["app", "tests"]
pythonpath = ["."]
