# Alembic config. The DB URL is NOT here: migrations/env.py builds it from .env (migrator login).
# Usage: see .claude/skills/add-migration/SKILL.md

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# e.g. 20261030_1200_0001_create_domain_schemas.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 60
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/Scripts/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
